{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registrar servicio</title>
    <link rel="stylesheet" href="{% static 'servicios/css/styles.css' %}">
</head>
<body>
    <nav class="nav">
        <a href="/">Inicio</a>
        <a href="{% url 'clientes:paginaClientes' %}">Clientes</a>
        <a href="{% url 'servicios:paginaServicios' %}">Servicios</a>
        <a href="{% url 'servicios:crear_servicio' %}">Nuevo servicio</a>
    </nav>

    <div class="contenedor">
        <h1>Registrar servicio</h1>

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}

            {% for campo in formulario %}
                <div class="campo">
                    {{ campo.label_tag }}
                    {{ campo }}
                    {% if campo.errors %}
                        <div class="error">{{ campo.errors|striptags }}</div>
                    {% endif %}
                </div>
            {% endfor %}

            <button type="submit" class="btn">Guardar servicio</button>
            <a href="{% url 'servicios:paginaServicios' %}">Cancelar</a>
        </form>
    </div>
</body>
</html>
